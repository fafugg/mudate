services:
  app:
    build: .
    ports:
      - "8010:8010"
    volumes:
      # db.json is stored in ./data/ on your host so it survives container restarts
      - ./data:/data
    environment:
      - DB_PATH=/data/db.json
      # Optional fallbacks; Georef works without a key.
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY:-}
      - OPENCAGE_API_KEY=${OPENCAGE_API_KEY:-}
      # Self-hosted or third-party Nominatim search endpoint (not the public OSMF server).
      - NOMINATIM_URL=${NOMINATIM_URL:-}
    restart: unless-stopped
